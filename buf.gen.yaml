version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/kodaikumatani/grpc-golang/internal/pb
  disable:
    - module: buf.build/googleapis/googleapis
      file_option: go_package_prefix
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: internal/pb
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: internal/pb
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.25.1
    out: internal/pb
    opt:
      - paths=source_relative
