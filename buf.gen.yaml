version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/kodaikumatani/grpc-golang/internal/pb
plugins:
  - remote: buf.build/protocolbuffers/go
    out: internal/pb
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: internal/pb
    opt:
      - paths=source_relative
